services:
  ros:
    build: .

    container_name: bluer_ugv_ros_rpi
    network_mode: host
    privileged: true
    user: "0:0"
    group_add:
      - "986"
    devices:
      - /dev/gpiomem:/dev/gpiomem
      - /dev/mem:/dev/mem
    stdin_open: true
    tty: true
    volumes:
      - /home/pi/git:/root/git

      # Optional: persist venv & pip cache across rebuilds (faster)
      - bluer_venv:/root/venv
      - bluer_pip_cache:/root/.cache/pip

      # ✅ Let RPi.GPIO detect the platform:
      - /proc/device-tree:/proc/device-tree:ro
      - /sys/firmware/devicetree/base:/sys/firmware/devicetree/base:ro

volumes:
  bluer_venv:
  bluer_pip_cache:
